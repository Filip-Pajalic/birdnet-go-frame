[workspace]
resolver = "3"
members = [
    "apps/fake-birdnet",
    "apps/server",
    "crates/art-mock",
    "crates/art-pack",
    "crates/art-webp",
    "crates/bird-sizes",
    "crates/birdnet-client",
    "crates/birdnet-mock",
    "crates/birdnet-model",
    "crates/frame-core",
    "crates/frame-http",
    "crates/frame-layout",
    "crates/frame-raster",
    "crates/lan-http",
    "crates/lite-json",
    "crates/page-text",
    "crates/panel-t133a01",
    "crates/panel-wake",
    "crates/transport-lan",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/Filip-Pajalic/birdnet-go-frame"

[workspace.dependencies]
art-mock = { path = "crates/art-mock", version = "0.1.0" }
art-pack = { path = "crates/art-pack", version = "0.1.0" }
art-webp = { path = "crates/art-webp", version = "0.1.0" }
bird-sizes = { path = "crates/bird-sizes", version = "0.1.0" }
birdnet-client = { path = "crates/birdnet-client", version = "0.1.0" }
birdnet-mock = { path = "crates/birdnet-mock", version = "0.1.0" }
birdnet-model = { path = "crates/birdnet-model", version = "0.1.0" }
frame-core = { path = "crates/frame-core", version = "0.1.0" }
frame-http = { path = "crates/frame-http", version = "0.1.0" }
frame-layout = { path = "crates/frame-layout", version = "0.1.0" }
frame-raster = { path = "crates/frame-raster", version = "0.1.0" }
lan-http = { path = "crates/lan-http", version = "0.1.0" }
lite-json = { path = "crates/lite-json", version = "0.1.0" }
page-text = { path = "crates/page-text", version = "0.1.0" }
panel-t133a01 = { path = "crates/panel-t133a01", version = "0.1.0" }
panel-wake = { path = "crates/panel-wake", version = "0.1.0" }
transport-lan = { path = "crates/transport-lan", version = "0.1.0" }

# Third-party crates. Keep this list short: see docs/explanation/dependencies.md before adding one.
# Font rasterising. No default features: no std, no SIMD tables.
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }
# Decodes fugleramme's webp artwork. Image codecs are the kind of job worth a crate.
image-webp = "0.2"
# The traits every embedded Rust HAL implements (SPI, pins, delays), so the panel driver runs on
# the ESP32 and against test mocks alike. No dependencies of its own.
embedded-hal = "1.0"
# Float maths for no_std. fontdue already pulls it in (via ttf-parser), so it adds nothing.
libm = "0.2"

# Lints named by Google's Rust Style Guide, plus the error-handling rules it describes.
# See STYLE.md for the rules that are enforced by review instead.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unstable_features = "forbid"

[workspace.lints.clippy]
borrowed_box = "deny"
expect_used = "warn"
len_without_is_empty = "deny"
missing_panics_doc = "warn"
new_without_default = "deny"
ptr_arg = "deny"
should_implement_trait = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
wrong_self_convention = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Packing birds and decoding plates are slow unoptimised; keep debug runs and tests quick.
[profile.dev.package.frame-layout]
opt-level = 2

[profile.dev.package.frame-raster]
opt-level = 2

[profile.dev.package.art-webp]
opt-level = 2

[profile.dev.package.image-webp]
opt-level = 2
