[workspace]
resolver = "3"
members = [
    "apps/fake-birdnet",
    "apps/server",
    "crates/art-mock",
    
    "crates/art-pack",
    "crates/bird-sizes",
    "crates/birdnet-client",
    "crates/birdnet-mock",
    "crates/birdnet-model",
    "crates/frame-core",
    "crates/frame-http",
    "crates/frame-layout",
    "crates/frame-raster",
    "crates/lan-http",
    "crates/transport-lan",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Filip-Pajalic/birdnet-go-frame"

[workspace.dependencies]
art-mock = { path = "crates/art-mock" }
art-pack = { path = "crates/art-pack" }
bird-sizes = { path = "crates/bird-sizes" }
birdnet-client = { path = "crates/birdnet-client" }
birdnet-mock = { path = "crates/birdnet-mock" }
birdnet-model = { path = "crates/birdnet-model" }
frame-core = { path = "crates/frame-core" }
frame-http = { path = "crates/frame-http" }
frame-layout = { path = "crates/frame-layout" }
frame-raster = { path = "crates/frame-raster" }
lan-http = { path = "crates/lan-http" }
transport-lan = { path = "crates/transport-lan" }

# Third-party crates. Keep this list short: see docs/explanation/dependencies.md before adding one.
# Font rasterising. No default features: no std, no SIMD tables.
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }
# Float maths for no_std. fontdue already pulls it in (via ttf-parser), so it adds nothing.
libm = "0.2"

# Lints named by Google's Rust Style Guide, plus the error-handling rules it describes.
# See STYLE.md for the rules that are enforced by review instead.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unstable_features = "forbid"

[workspace.lints.clippy]
borrowed_box = "deny"
expect_used = "warn"
len_without_is_empty = "deny"
missing_panics_doc = "warn"
new_without_default = "deny"
ptr_arg = "deny"
should_implement_trait = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
wrong_self_convention = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
