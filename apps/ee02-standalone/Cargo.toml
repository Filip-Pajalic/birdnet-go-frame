[package]
name = "ee02-standalone"
description = "Firmware for an ESP32-S3 with a Spectra 6 panel that needs no server: ask BirdNET-Go, draw the page itself if the birds changed, deep-sleep."
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Filip-Pajalic/birdnet-go-frame"
publish = false

# Its own workspace, built with Espressif's Xtensa toolchain (rust-toolchain.toml, and the target
# and build-std in .cargo/config.toml), like apps/ee02-thin. The root workspace excludes it.
[workspace]

[features]
# The board: the XIAO EE02 with the 13.3" panel by default, or Seeed's reTerminal E1002 with the
# 7.3" panel (`--no-default-features --features board-e1002`).
default = ["board-ee02"]
board-ee02 = []
board-e1002 = []

[dependencies]
art-mock = { path = "../../crates/art-mock", version = "0.1.0" }
art-pack = { path = "../../crates/art-pack", version = "0.1.0" }
birdnet-client = { path = "../../crates/birdnet-client", version = "0.1.0" }
birdnet-model = { path = "../../crates/birdnet-model", version = "0.1.0" }
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = { version = "0.1.2", default-features = false }
embassy-net = { version = "0.9.1", default-features = false, features = ["dhcpv4", "medium-ethernet", "proto-ipv4", "tcp", "udp"] }
embassy-time = { version = "0.5.0", default-features = false }
esp-alloc = { version = "0.11.0", default-features = false, features = ["compat", "esp32s3", "global-allocator"] }
esp-backtrace = { version = "0.20.0", default-features = false, features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", default-features = false, features = ["esp32s3"] }
esp-hal = { version = "~1.2.2", default-features = false, features = ["esp32s3", "rt", "unstable"] }
# Logs go to the USB serial port only: on the EE02, UART0's pins switch and select the panel.
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "jtag-serial"] }
esp-radio = { version = "1.0.0-beta.1", default-features = false, features = ["esp-alloc", "esp32s3", "unstable", "wifi"] }
esp-rtos = { version = "0.4.0", default-features = false, features = ["embassy", "esp-alloc", "esp-radio", "esp32s3"] }
frame-artist = { path = "../../crates/frame-artist", version = "0.1.0" }
frame-core = { path = "../../crates/frame-core", version = "0.1.0" }
frame-raster = { path = "../../crates/frame-raster", version = "0.1.0" }
frame-standalone = { path = "../../crates/frame-standalone", version = "0.1.0" }
glass-esp = { path = "../../crates/glass-esp", version = "0.1.0" }
page-text = { path = "../../crates/page-text", version = "0.1.0" }
panel-wake = { path = "../../crates/panel-wake", version = "0.1.0" }
# Atomics that esp-hal lets live in RTC memory through deep sleep, so the memory needs no
# `unsafe`. Already in the tree through esp-hal.
portable-atomic = { version = "1.11", default-features = false }
transport-esp = { path = "../../crates/transport-esp", version = "0.1.0" }

[lints.rust]
missing_docs = "warn"
unstable_features = "forbid"
unsafe_code = "forbid"

[lints.clippy]
borrowed_box = "deny"
expect_used = "warn"
large_stack_frames = "deny"
len_without_is_empty = "deny"
mem_forget = "deny"
missing_panics_doc = "warn"
new_without_default = "deny"
ptr_arg = "deny"
should_implement_trait = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
wrong_self_convention = "deny"

[profile.dev]
# Unoptimised code is too slow and too big for the chip.
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

# Drawing the page is most of a wake's time awake; trade a little flash for speed there.
[profile.release.package.frame-layout]
opt-level = 2

[profile.release.package.frame-raster]
opt-level = 2

[profile.release.package.fontdue]
opt-level = 2
