name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: checkboxes
    id: dependencies
    attributes:
      label: Dependencies
      options:
        - label: I understand new third-party crates need a strong reason (see docs/explanation/dependencies.md).
