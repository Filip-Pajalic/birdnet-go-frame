name: CI

# Runs on pushes to main and on every pull request, including pull requests from forks.
# It needs no secrets and only read access, so code from a fork can run it safely.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: Format (Google style, nightly rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal -c rustfmt
      - run: cargo +nightly fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  msrv:
    name: Minimum Rust version (1.87, set by fontdue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.87 --profile minimal
      - run: cargo +1.87 check --workspace --all-targets --locked

  no-std:
    name: no_std crates build for a bare-metal target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # Proves the libraries the ESP32 shares with the server never reach for std.
      - run: >-
          cargo build --locked --target thumbv7em-none-eabihf
          -p frame-core -p birdnet-model -p birdnet-client -p birdnet-mock
          -p frame-layout -p frame-raster -p art-pack -p art-mock -p bird-sizes
          -p lite-json -p page-text

  docs:
    name: Docs build without warnings
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  dependencies:
    name: Dependencies (licences, advisories, duplicates, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  static-binary:
    name: Static Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p server -p fake-birdnet
      - name: Report sizes
        run: |
          ls -l target/x86_64-unknown-linux-musl/release/birdnet-go-frame target/x86_64-unknown-linux-musl/release/fake-birdnet
          {
            echo "### Binary sizes"
            echo '```'
            ls -l target/x86_64-unknown-linux-musl/release/birdnet-go-frame target/x86_64-unknown-linux-musl/release/fake-birdnet
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test against the built-in mock
        run: |
          BIRDNET_URL=mock LISTEN=127.0.0.1:8080 target/x86_64-unknown-linux-musl/release/birdnet-go-frame &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          curl -fsS -o panel.bin http://127.0.0.1:8080/panel
          test "$(stat -c %s panel.bin)" = "960000"
          downloaded="$(curl -fsS --compressed -o inflated.bin -w '%{size_download}' http://127.0.0.1:8080/panel)"
          test "$downloaded" -lt 480000
          cmp panel.bin inflated.bin
